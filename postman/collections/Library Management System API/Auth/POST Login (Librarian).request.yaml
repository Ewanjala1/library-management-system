$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "librarian@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.access_token) {
          pm.collectionVariables.set('librarian_token', res.access_token);
      }
    language: text/javascript
order: 3000
